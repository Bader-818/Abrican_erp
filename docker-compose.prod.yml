# Production stack: built from the `production` image stages, same-origin
# (nginx serves the SPA and proxies /api to the backend), with the database
# and backend kept off the public network — only the web port is published.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Put HTTPS in front of the published web port with a reverse proxy
# (Caddy/Traefik/nginx + Let's Encrypt) — see DEPLOYMENT.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No published port: the database is reachable only on the internal network.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      STORAGE_ROOT: /app/storage
      SEED_ON_START: ${SEED_ON_START:-true}
      ADMIN_NAME: ${ADMIN_NAME:-System Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - backend_storage:/app/storage
    # No published port: reached only via the frontend's nginx /api proxy.
    expose:
      - '3000'

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${HTTP_PORT:-80}:80'

volumes:
  db_data:
  backend_storage:
