name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (build · unit · e2e · audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abrican
          POSTGRES_PASSWORD: abrican_ci_password
          POSTGRES_DB: abrican_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abrican"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://abrican:abrican_ci_password@localhost:5432/abrican_erp?schema=public
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      # Seed needs an explicit password (no default is shipped) and the e2e
      # suite logs in with it directly, so skip the first-login change gate.
      ADMIN_PASSWORD: ci_admin_password
      ADMIN_FORCE_PASSWORD_CHANGE: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run build
      - name: Unit tests
        run: npx jest --ci
      - name: E2E tests
        run: npm run test:e2e
      - name: Dependency audit (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

  frontend:
    name: Frontend (build · unit · audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npm test
      - name: Dependency audit (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true
